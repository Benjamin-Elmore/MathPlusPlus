[package]
name = "mpp-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Math++ proofs: the step checker, the Lean 4 bridge and the proof agent client"

[dependencies]
mpp-core = { path = "../mpp-core" }
mpp-syntax = { path = "../mpp-syntax" }
mpp-eval = { path = "../mpp-eval", default-features = false }
num-complex = "0.4"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"] }
# Each platform gets its own real credential store; elsewhere keyring would fall back to
# an in-memory mock, so CredentialStore refuses to work there instead (see agent/key.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
