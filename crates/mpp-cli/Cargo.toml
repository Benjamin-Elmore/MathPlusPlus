[package]
name = "mpp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line entry point for Math++"

build = "build.rs"

[lib]
name = "mpp_cli"
path = "src/lib.rs"

[[bin]]
name = "mpp"
path = "src/main.rs"

[dependencies]
mpp-syntax = { path = "../mpp-syntax" }
mpp-eval = { path = "../mpp-eval" }
mpp-export = { path = "../mpp-export" }
mpp-ide = { path = "../mpp-ide" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
